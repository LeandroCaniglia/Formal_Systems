name: Build Book PDF

on:
  push:
    branches: [ main ]
    paths:
      - '**.tex'
      - '**.bib'
      - '**.sty'
      - '**.cls'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile LaTeX book
        uses: xu-cheng/latex-action@v4
        with:
          root_file: 0-Formal-systems.tex

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f main.pdf
          git diff --staged --quiet || git commit -m "chore: update compiled PDF [skip ci]"
          git push
